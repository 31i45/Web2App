[workspace]
members = ["tail-core", "child", "master"]
resolver = "2"

[workspace.package]
version = "3.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tail-core = { path = "tail-core" }
# devtools：debug 构建的开发者工具（Windows WebView2 / Linux WebKitGTK 均支持）。
# os-webview + x11：wry 的 Linux/BSD 后端开关——wry 的 build.rs 只在
# `feature = "os-webview"` 且目标为 Linux/BSD 时置 `cfg(gtk)`，未开启则该后端
# 整体不编译（正是 CI 首次 Linux 构建的失败原因）；`x11` 再启用 gdkx11/x11-dl
# 与 `tao/x11`，使 X11 形态的窗口句柄可被接管。二者引用的依赖在 wry 内均声明为
# 「仅 Linux/BSD 目标」的可选依赖 → Windows 目标下启用它们是空操作（不进依赖图、
# 不影响产物），且这正是 wry 的默认特性组合，故跨平台统一开启。
wry = { version = "0.57", default-features = false, features = ["devtools", "os-webview", "x11"] }
tao = "0.37"
png = "0.18"
# 宿主层 Alt+Home 需要 `ICoreWebView2Controller::add_AcceleratorKeyPressed`，
# wry 未 re-export 该类型 → 必须直接依赖。版本与 wry 传递依赖一致，
# 不引入任何新 crate、不增加产物体积（见 audit.ps1 的 cargo tree 断言）。
webview2-com = "0.39"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

# Release 产物极致轻量：全 workspace 共享同一组优化开关。
# panic=abort 仅作用于 release；测试走 dev profile（unwind），不受影响。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
