[package]
name = "web2app"
version = "1.0.0"
edition = "2021"
description = "Self-reproducing single-file cross-platform web-to-app packager"
license = "MIT"

[dependencies]
# default features = os-webview + x11：Linux 后端（gtk/webkit2gtk）由 os-webview
# 开启——曾因 default-features=false 仅启 devtools 而关闭，Linux 编译 E0433。
wry = { version = "0.57", features = ["devtools"] }
tao = "0.37"
dunce = "1"
png = "0.18"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
