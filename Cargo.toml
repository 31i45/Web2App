[workspace]
members = ["tail-core", "child", "master"]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tail-core = { path = "tail-core" }
wry = { version = "0.57", default-features = false, features = ["devtools"] }
tao = "0.37"
png = "0.18"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

# Release 产物极致轻量：全 workspace 共享同一组优化开关。
# panic=abort 仅作用于 release；测试走 dev profile（unwind），不受影响。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
