[package]
name = "child"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web2App 子应用运行时（用户分发的精简单文件产物）"

[dependencies]
tail-core = { workspace = true }
wry = { workspace = true }
tao = { workspace = true }

# Windows-only 运行时依赖：宿主层 Alt+Home 需要 WebView2 原生接口
# （`ICoreWebView2Controller::add_AcceleratorKeyPressed`）。Linux/macOS 目标
# 无此依赖 → 必须按目标平台下沉，否则 Unix 目标会去编译 Windows crate。
[target.'cfg(windows)'.dependencies]
webview2-com = { workspace = true }

# Linux-only：GTK 外壳（弹窗顶层窗、全屏切换）需要 gtk-rs 类型。
# 非新增依赖——`gtk` 早已由 tao/wry 传递引入并在 Cargo.lock 中锁定（0.18.2），
# 此处只是把它变为可直接引用（依赖图不变）。gtk-rs 链接系统 libgtk-3（非内嵌引擎），
# 不增产物体积，符合设计文档 §3.4 对 Linux 侧「gtk 为系统库链接」的说明。
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
png = { workspace = true }

# winres 保留为**无条件** build-dependency：build script 在 host 上编译，
# 其 Windows 分支虽被 `CARGO_CFG_TARGET_OS` 运行时门控，但代码仍需可编译；
# 且 winres 本身支持非 Windows host 交叉编译。build-dependency 不进产物，
# 不影响轻量红线（见 docs/CROSS_PLATFORM_DESIGN.md §3.4）。
[build-dependencies]
winres = "0.1"
