version: 2
updates:
  # === Rust / Cargo 依赖 ===
  # 零锁定策略：所有依赖的所有 semver 范围都自动升级。
  # 风险控制：auto-approve workflow 只在 CI 全绿时才 approve；
  # CI 红 → auto-approve 失败 → PR 不会被自动合并 → 人类介入。
  - package-ecosystem: cargo
    directory: /
    schedule:
      # daily — 安全漏洞第一时间响应
      interval: daily
      time: "04:00"
    open-pull-requests-limit: 10
    groups:
      # WebView 核心（wry / tao / webview2-com 版本必须同步，分开升会编译失败）
      webview-core:
        patterns:
          - "wry"
          - "tao"
          - "webview2-com*"
      # 解析器 / 格式库（html/url/base64/png 通常 patch 安全）
      parsers:
        patterns:
          - "*html*"
          - "*url*"
          - "*base64*"
          - "*png*"

  # === GitHub Actions ===
  # 同样零锁定；Actions 大版本变更如果破坏 CI，CI 会红 → 不自动合并。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
