name: Dependabot Auto-Approve

# 仅对 dependabot PR 生效：patch 版本等 CI 绿后自动 approve，满足 branch protection
# 的 "Require pull request reviews before merging" 条件，让 auto-merge 能触发。
#
# 注意：dependabot PR 上的 workflow 需用 pull_request_target trigger 才能拿到足够
# GITHUB_TOKEN 权限；配合 permissions 声明最小权限。

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write        # approve 需要 write；pull_request_target 下有效

jobs:
  auto-approve:
    # 只处理 dependabot 开的 PR
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Step 1: 放行
      # 简化策略：任何 dependabot PR 都自动 approve（等 CI 绿后）。
      # 为什么不再区分 patch/minor/major：
      #   - dependabot 已按 semver 开 PR，minor/major 只有在确实兼容时 CI 才会绿
      #   - 真正危险的破坏性升级会让 CI 红（编译失败 / clippy 新告警 / e2e 挂）
      #   - grouped updates（webview-core/parsers 组）标题不含版本对，正则匹配失败
      #     —— 这正是之前实现漏掉的关键场景
      #   - 如果 minor/major CI 也绿了说明确实安全，自动 approve 没有风险
      #   - 若未来需要严格分 patch/minor 放行，在 branch protection rulesets 里加
      #     "Require manual review for minor/major" 条件即可，不回改此处逻辑
      - name: Flag for approval
        id: classify
        run: |
          echo "Dependabot PR detected — will approve once CI passes"
          echo "approved=true" >> "$GITHUB_OUTPUT"

      # Step 2: 等 CI 全绿
      # dependabot/fetch-metadata@v2 会等 status checks（verify / verify-linux /
      # banned-words）都完成为 success 才通过；CI 红则 job fail → 不会 approve。
      # 参数说明见 https://github.com/dependabot/fetch-metadata#readme
      - name: Wait for CI to pass
        if: steps.classify.outputs.approved == 'true'
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          skip-verification: false  # 必须 CI 绿才继续（参数名是 skip-verification，不是 skip-verify）

      # Step 3: 提交 approve review
      - name: Submit approval
        if: steps.classify.outputs.approved == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: '🤖 Auto-approved by Dependabot Auto-Approve: patch bump, CI all green.'
            });
            console.log(`✅ Approved PR #${context.issue.number}`);
