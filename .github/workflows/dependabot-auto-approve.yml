name: Dependabot Auto-Approve + Auto-Merge

# 只处理 dependabot 开的 PR：
#   1. 等 CI（verify windows / verify ubuntu / banned-words）全绿
#   2. 提交 APPROVE review（满足 branch protection 的 "Required approvals: 1"）
#   3. 启用 auto-merge；若仓库未开 auto-merge 能力，则直接 --admin 合并
#
# 红线：CI 不绿 → fetch-metadata 直接失败 → 不 approve、不合并。
# 这是"零锁定"策略唯一的安全网，因此这里绝不允许跳过验证。

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write          # merge 需要
  pull-requests: write     # approve / merge 需要

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # dependabot/fetch-metadata 会轮询 status checks 直到全部完成。
      # skip-verification: false（注意参数名是 skip-verification）→ CI 红则本步失败。
      - name: Wait for CI to pass
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          skip-verification: false

      - name: Approve and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # 本 job 不 checkout，工作目录不是 git 仓库 → gh 必须显式 -R 指定仓库，
          # 否则报 "fatal: not a git repository"。
          gh pr review "$PR" -R "$REPO" --approve \
            --body "🤖 自动批准：CI 全绿（verify windows / verify ubuntu / banned-words）。依赖升级已通过完整门禁。"
          # 优先走 auto-merge（等 required checks 收尾后再合），
          # 仓库未启用 auto-merge 能力时退化为 admin 直接合并。
          gh pr merge "$PR" -R "$REPO" --squash --auto \
            || gh pr merge "$PR" -R "$REPO" --squash --admin
          echo "✅ merged PR #${PR}: ${TITLE}"
