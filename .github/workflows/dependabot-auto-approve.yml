name: Dependabot Auto-Approve + Auto-Merge

# CI 整体成功后才触发：不轮询、不抢跑，也不使用 --admin 绕过门禁。
# workflow_run 使用默认分支中的本文件，并携带写权限；这里绝不 checkout 或执行 PR 代码。

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Approve and merge Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          mapfile -t prs < <(printf '%s' "$PRS" | jq -r '.[].number')
          if [ "${#prs[@]}" -eq 0 ]; then
            echo "No pull request associated with CI run; nothing to merge."
            exit 0
          fi

          for pr in "${prs[@]}"; do
            gh api "repos/$REPO/pulls/$pr" > pr.json
            author=$(jq -r '.user.login' pr.json)
            state=$(jq -r '.state' pr.json)
            head=$(jq -r '.head.sha' pr.json)
            if [ "$author" != "dependabot[bot]" ] || [ "$state" != "open" ]; then
              echo "Skipping PR #$pr: not an open Dependabot PR."
              continue
            fi
            if [ "$head" != "$HEAD_SHA" ]; then
              echo "Skipping PR #$pr: CI success belongs to an older commit."
              continue
            fi

            gh pr review "$pr" -R "$REPO" --approve \
              --body "自动批准：CI 整体成功，依赖升级已通过完整门禁。"
            # 普通 merge 仍受 ruleset 门禁约束；绝不使用 --admin 绕过。
            gh pr merge "$pr" -R "$REPO" --squash
            echo "Merged Dependabot PR #$pr."

            # GITHUB_TOKEN 产生的 push 不会再触发工作流；显式 dispatch 是官方例外。
            # 只有合并成功后才执行，CI 会在 main 上重新验证并发布下一个 patch。
            gh workflow run ci.yml -R "$REPO" --ref main -f release=true
          done
