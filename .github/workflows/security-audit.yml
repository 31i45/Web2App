name: Security Audit

# 安全扫描 — 用户最关心的优先级。
#   - 每周一凌晨自动扫一次（响应新发布的漏洞通告）
#   - Cargo.lock / Cargo.toml 变更后立即扫（dependabot 升级后立刻确认无新漏洞引入）
#   - 手动触发（workflow_dispatch）
#
# 高危漏洞（critical / high）→ CI fail；中低危→只告警不阻断。
# 扫描覆盖 cargo audit（RustSec advisories）+ cargo deny（license / bans / sources）。

on:
  schedule:
    # 每周一 03:00 CST = 每周日 19:00 UTC 执行
    - cron: '0 19 * * 0'
  push:
    branches: [main]
    paths: ['Cargo.lock', 'Cargo.toml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write        # 发现高危漏洞时自动开 Issue

jobs:
  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 只跑 security audit，不编译（--quiet 避免输出太多）
      - name: Run cargo audit
        run: |
          cargo install cargo-audit --locked
          # --deny warnings 让 critical/high/medium/low 都 fail；
          # 但我们只想 critical/high fail → 用 --ignore 放行确认安全的
          cargo audit --quiet 2>&1 || {
            echo "============================"
            echo "⚠️  SECURITY ADVISORIES FOUND"
            echo "============================"
            echo "Check: https://rustsec.org/advisories"
            exit 1
          }
          echo "✅ cargo audit: no vulnerabilities found"

  cargo-deny:
    name: cargo deny (license / bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run cargo deny check
        run: |
          cargo install cargo-deny --locked
          cargo deny check --config-path .cargo/deny.toml 2>&1 || {
            echo "============================"
            echo "⚠️  CARGO DENY FAILED"
            echo "============================"
            exit 1
          }
          echo "✅ cargo deny: all checks passed"
