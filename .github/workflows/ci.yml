name: CI

# 设计（单一闭环，无跨 workflow 触发、无分支保护依赖）：
#
#   pull_request  → verify (windows) + verify (ubuntu) + banned-words
#                   ↳ 三项全绿 + dependabot-auto-approve 的 approve/auto-merge
#                     → 合入 main
#   push: main    → 同样跑三项门禁
#                   → prepare-release：三项全绿后自动算下一个 patch 版本、
#                     同步 Cargo.lock、提交、打 tag
#                   → build (windows) + build (linux)：checkout 该 tag 构建
#                   → publish release：汇总产物 + SHA256 → GitHub Release
#
# 为什么版本号必须回写并打进 tag：build 作业有 "tag == workspace version" 三方
# 等值门禁（tag / Cargo.toml / .deb control 同源）。因此 prepare-release 会把
# bump 提交进 tag；main 分支的回写若被分支保护拒绝则降级为仅推 tag（发布不受影响）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Run the full gates and publish the next patch release from main
        required: true
        type: boolean
        default: false

# 同一 ref 的新推送取消旧运行；tag 与 main 发布运行不取消（保证发布完整性）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 最小权限：默认只读；prepare-release / release 单独提升 contents: write
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 主门禁（G-0a）：Windows 是唯一发布目标，故 Windows 侧仍跑全部门禁
  # （winres 资源编译 / user32 MessageBox / UpdateResource / 体积红线 / 结构审计）。
  # Windows 之外的平台外壳在下一 job 验编译（阶段 0b 起 linux）。
  verify:
    name: verify (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # 两阶段构建是 v2 架构固有约束：master 编译期内嵌 child.exe，
      # 干净 target 下 cargo test 的并行调度不保证 child 先完成，必须显式先行。
      - name: Build child (debug; test/clippy 的前提)
        run: cargo build -p child --locked

      # 测试数门禁：套件规模只许增长不许缩水（低于基线即失败，防测试被静默删除）。
      # 注意：name 值含 "gate: "（冒号+空格）属 YAML 敏感字符，必须整串加引号，
      # 否则解析器将其误判为嵌套 mapping 导致整个工作流无法加载（2026-10-19 实测）。
      - name: "Tests (gate: total passed >= 84)"
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace 2>&1 | tee test.log
          total=$(grep -oE '[0-9]+ passed' test.log | awk '{s+=$1} END {print s+0}')
          echo "total passed: ${total}"
          rm -f test.log
          if [ "${total}" -lt 84 ]; then
            echo "::error::test-count gate: expected >= 84 passed, got ${total}"
            exit 1
          fi

      - name: Clippy (zero warnings, warnings as errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      # build.ps1 保证顺序：child 先于 master（master 编译期内嵌 child.exe）
      - name: Release build (child -> master -> assemble)
        run: ./build.ps1 -SkipTests -SkipClippy

      - name: Size red lines (child < 1MB, web2app < 2MB)
        shell: bash
        run: |
          set -euo pipefail
          child=$(wc -c < target/release/child.exe)
          master=$(wc -c < dist/web2app.exe)
          echo "child:   $child bytes"
          echo "web2app: $master bytes"
          if [ "$child" -gt 1048576 ]; then echo "::error::child exceeds 1MB promise ($child)"; exit 1; fi
          if [ "$master" -gt 2097152 ]; then echo "::error::web2app exceeds 2MB target ($master)"; exit 1; fi

      # 结构隔离：child 产物不含写资源/签名/打包能力，且依赖图不含 master。
      - name: Structural audit
        shell: pwsh
        run: ./audit.ps1 -ChildPath target/release/child.exe -MasterPath dist/web2app.exe

  # Linux 接缝（阶段 0b）+ G-1 无头门禁（阶段 1）：平台外壳与 child/master 同签名
  # 可编译、单测/clippy 全绿之外，再跑完整 G-1（docs/CROSS_PLATFORM_DESIGN.md §7）——
  # ELF 结构审计（audit.ps1 Linux 分支）+ 无头 e2e（按键 × 焦点矩阵 / data_directory
  # 隔离 / deb 打包安装运行卸载）。wry 的 Linux 后端经 pkg-config 链接系统
  # WebKitGTK/GTK → 必须装开发库；e2e 另需 Xvfb/xdotool，以及 control Depends 的
  # 运行库（e2e 用 `dpkg -i` 直装，不解析依赖，故显式预装）。
  # 基线钉在 ubuntu-22.04（glibc 2.35）：ubuntu-latest（24.04）构建出的二进制带
  # GLIBC_2.39 weak 引用，在 jammy 系目标系统（Zorin 17 / 国产桌面 OS）上每次启动
  # 都刷 `weak version GLIBC_2.39 not found` 警告。22.04 构建产物在 22.04+ 全系可跑。
  verify-linux:
    name: verify (ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install WebKitGTK dev libraries + e2e prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb xdotool gstreamer1.0-libav gstreamer1.0-plugins-bad dbus-x11 at-spi2-core

      # 两阶段构建同 Windows：master 编译期内嵌 child（Linux 产物名为 child，无 .exe）。
      - name: Build child (debug; test/clippy 的前提)
        run: cargo build -p child --locked

      # 测试数门禁：同 verify (windows)——低于基线即失败，防测试被静默删除。
      - name: "Tests (gate: total passed >= 84)"
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace 2>&1 | tee test.log
          total=$(grep -oE '[0-9]+ passed' test.log | awk '{s+=$1} END {print s+0}')
          echo "total passed: ${total}"
          rm -f test.log
          if [ "${total}" -lt 84 ]; then
            echo "::error::test-count gate: expected >= 84 passed, got ${total}"
            exit 1
          fi

      - name: Clippy (zero warnings, warnings as errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      # 审计与 e2e 跑 release 产物（与 G-0a 口径一致：审计/演练对象 = 交付形态）。
      # 两阶段显式先行：并行调度不保证 child 先于 master 完成（同上）。
      - name: Release build (child -> workspace)
        run: |
          cargo build -p child --release --locked
          cargo build --workspace --release --locked

      # G-1：结构隔离审计（Linux 分支 = \x7fELF + e_shoff 映像计数）
      - name: Structural audit (ELF)
        shell: pwsh
        run: ./audit.ps1 -ChildPath target/release/child -MasterPath target/release/web2app

      # G-1：无头门禁（脚本自带 Xvfb 起停；全部以 exit code 判定）
      - name: E2E gate (headless Xvfb)
        env:
          NO_AT_BRIDGE: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          dbus-run-session -- bash -c 'CHILD=target/release/child MASTER=target/release/web2app bash e2e.sh'

  # 违禁词词级扫描（.skills/03 A3）：对外文档不得出现 INSTANCE.md 清单中的内部术语。
  # 清单从 .skills/INSTANCE.md 标记块读取——改清单改 INSTANCE.md，不改本文件。
  # .skills/ 未提交入库时清单为空 → 本 job 显式失败（强制实例文件随代码入库）。
  banned-words:
    name: banned-words scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan public docs (word-level)
        run: |
          set -euo pipefail
          list=$(sed -n '/CI-BANNED-WORDS-BEGIN/,/CI-BANNED-WORDS-END/p' .skills/INSTANCE.md \
                 | grep -v 'CI-BANNED-WORDS' | grep -v '^[[:space:]]*$' || true)
          if [ -z "$list" ]; then
            echo "::error::banned-word list is empty — check .skills/INSTANCE.md markers (CI-BANNED-WORDS-BEGIN/END)"
            exit 1
          fi
          fail=0
          while IFS= read -r word; do
            [ -n "$word" ] || continue
            if grep -n -- "$word" README.md README.zh-CN.md; then
              echo "::error::banned word in public docs: $word"
              fail=1
            fi
          done <<< "$list"
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "banned-words scan: clean"

  # 发布准备：三项门禁全绿后，算下一个 patch 版本 → 同步 Cargo.lock → 提交 → 打 tag。
  # 普通 main push 或 Dependabot 合并后的显式 release dispatch 执行；
  # release 自身产生的 "chore(release): ..." 提交不再触发。
  prepare-release:
    name: prepare release
    needs: [verify, verify-linux, banned-words]
    if: >-
      github.ref == 'refs/heads/main'
      && (
        (github.event_name == 'push'
          && !startsWith(github.event.head_commit.message, 'chore(release):'))
        || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.release == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Compute next patch version
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          ver=${latest#v}
          IFS=. read -r major minor patch <<< "$ver"
          new="${major}.${minor}.$((patch + 1))"
          echo "latest tag: ${latest} → next: v${new}"
          echo "tag=v${new}" >> "$GITHUB_OUTPUT"
          echo "new=${new}"  >> "$GITHUB_OUTPUT"

      - name: Bump workspace version and sync Cargo.lock
        run: |
          set -euo pipefail
          new="${{ steps.version.outputs.new }}"
          # 根 Cargo.toml 中唯一以 "version = " 开头的行就是 [workspace.package].version
          n=$(grep -c '^version = "' Cargo.toml)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly 1 'version = ' line in Cargo.toml, found $n"
            exit 1
          fi
          sed -i "s/^version = \".*\"$/version = \"${new}\"/" Cargo.toml
          # 关键：Cargo.lock 记录三个 workspace member 的版本，不同步则 --locked 必失败
          cargo update -p tail-core -p child -p master
          echo "--- Cargo.toml ---"; grep -m1 '^version = ' Cargo.toml
          echo "--- Cargo.lock members ---"; grep -A1 -E '^name = "(tail-core|child|master)"$' Cargo.lock | grep version

      - name: Commit, tag, and push
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): bump to ${TAG#v}"
          # 只推 tag，不 push main：main 受分支保护（需 PR），bot 无法直接写。
          # 版本号以 tag 为准——bump commit 挂在 tag 上，tag 内 Cargo.toml/lock 版本一致。
          # 下次发布从最新 tag 递增，与 main 上 Cargo.toml 的滞后无关。
          git tag -a "$TAG" -m "Release ${TAG#v}"
          git push origin "refs/tags/$TAG"
          echo "✅ tagged $TAG"

  # 发布（produces Windows 单目标产物）
  build:
    name: build (windows)
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      # 版本三方等值门禁：tag 名 == 根 Cargo.toml [workspace.package].version。
      # .deb control Version 由 CARGO_PKG_VERSION（同源于 workspace version）
      # 编译期写入 → 校验此处一处即闭环 tag / Cargo.toml / .deb 三方。
      - name: Version gate (tag == workspace version)
        shell: bash
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          cargo_ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          echo "tag=${tag} cargo=${cargo_ver}"
          if [ -z "${cargo_ver}" ] || [ "${tag}" != "${cargo_ver}" ]; then
            echo "::error::tag version (${tag}) != workspace Cargo.toml version (${cargo_ver})"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 与 build (linux) / verify 完全一致：不带 --target。
      # 原因：cargo 的 build script 始终在 host target（target/release/build/）下编译运行，
      # master/build.rs 经 OUT_DIR 反推 child 路径（target/release/child.exe）。
      # 一旦加 --target，child 产物落在 target/<triple>/release/ 而 build script OUT_DIR
      # 仍在 target/release/build/，反推出的 target/release/child.exe 不存在 → build.rs:61 panic。
      # windows-latest 的 host triple 本就是 x86_64-pc-windows-msvc，无需显式 --target。
      - name: Build child then workspace
        shell: bash
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          cargo build -p child --release --locked
          cargo build --workspace --release --locked
          bin="target/release/web2app.exe"
          size=$(wc -c < "$bin")
          if [ "$size" -gt 2097152 ]; then
            echo "::error::${bin} exceeds 2MB target ($size bytes)"
            exit 1
          fi
          mkdir -p dist
          cp "$bin" "dist/web2app-${TAG}-x86_64-pc-windows-msvc.exe"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: dist/*
          if-no-files-found: error

  # Linux 发布：打包器裸 ELF（分发形态与 Windows 裸 exe 对称，绿色即用；不产 .deb，
  # 理由见下方 Stage bare ELF）。
  # 同样钉 ubuntu-22.04——发布产物的 glibc 基线（见 verify-linux 注释）。
  build-linux:
    name: build (linux)
    needs: prepare-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      # 版本三方等值门禁：同 build (windows)——tag / Cargo.toml / .deb 一处校验闭环。
      - name: Version gate (tag == workspace version)
        shell: bash
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          cargo_ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          echo "tag=${tag} cargo=${cargo_ver}"
          if [ -z "${cargo_ver}" ] || [ "${tag}" != "${cargo_ver}" ]; then
            echo "::error::tag version (${tag}) != workspace Cargo.toml version (${cargo_ver})"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install WebKitGTK dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build child then workspace
        run: |
          cargo build -p child --release --locked
          cargo build --workspace --release --locked

      # master 分发形态跨平台对称：Windows 裸 exe / Linux 裸 ELF，绿色即用——
      # 不打 .deb（装进 /usr/bin 后产物落盘目录不可写，且违背「下载即跑」承诺）。
      # 只有 child 产物才是平台原生安装形态（.exe 单文件 / .deb 包）。
      - name: Stage bare ELF
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/web2app "dist/web2app-${TAG}-x86_64-unknown-linux-gnu"
          size=$(wc -c < "dist/web2app-${TAG}-x86_64-unknown-linux-gnu")
          if [ "$size" -gt 2097152 ]; then
            echo "::error::bare ELF exceeds 2MB target ($size bytes)"
            exit 1
          fi
          chmod +x dist/web2app-*
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux
          path: dist/*
          if-no-files-found: error

  # 汇总产物 + SHA256SUMS → GitHub Release（发布物唯一来源）
  release:
    name: publish release
    needs: [prepare-release, build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # download-artifact@v4 无 name 时按 artifact 名建子目录（dist/bin-windows/、
      # dist/bin-linux/）→ merge-multiple 平铺合并进 dist/，产物文件名各不相同无冲突。
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum web2app-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # gh release create --generate-notes 在 ubuntu runner 上静默失败（无输出、
      # 不创建 release、exit 0）—— 换用 GitHub API 直接创建，显式报错不静默。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          # 已存在则先删除（幂等重发）
          RELEASE_ID=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])" 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            curl -sf -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID"
          fi
          # 创建 release
          RELEASE_ID=$(curl -sf -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"Web2App ${TAG}\"}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "release id: $RELEASE_ID"
          # 上传产物
          for f in dist/*; do
            NAME=$(basename "$f")
            echo "uploading: $NAME"
            curl -sf -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets?name=$NAME"
          done
          echo "release published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
