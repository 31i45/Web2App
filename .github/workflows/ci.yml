name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# 同一 ref 的新推送取消旧运行；tag 发布运行不取消（保证发布完整性）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# 最小权限：默认只读；release job 单独提升 contents: write
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # v2 Windows-only：winres 资源编译 / user32 MessageBox / UpdateResource
  # 均为无条件 Windows 代码，非 Windows 目标已不构建。
  verify:
    name: verify (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # 两阶段构建是 v2 架构固有约束：master 编译期内嵌 child.exe，
      # 干净 target 下 cargo test 的并行调度不保证 child 先完成，必须显式先行。
      - name: Build child (debug; test/clippy 的前提)
        run: cargo build -p child --locked

      - name: Tests
        run: cargo test --locked --workspace

      - name: Clippy (zero warnings, warnings as errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      # build.ps1 保证顺序：child 先于 master（master 编译期内嵌 child.exe）
      - name: Release build (child -> master -> assemble)
        run: ./build.ps1 -SkipTests -SkipClippy

      - name: Size red lines (child < 1MB, web2app < 2MB)
        shell: bash
        run: |
          set -euo pipefail
          child=$(wc -c < target/release/child.exe)
          master=$(wc -c < dist/web2app.exe)
          echo "child:   $child bytes"
          echo "web2app: $master bytes"
          if [ "$child" -gt 1048576 ]; then echo "::error::child exceeds 1MB promise ($child)"; exit 1; fi
          if [ "$master" -gt 2097152 ]; then echo "::error::web2app exceeds 2MB target ($master)"; exit 1; fi

      # 结构性不可繁殖：child 产物不含写资源/签名/打包能力，且依赖图不含 master。
      - name: Structural non-reproduction audit
        shell: pwsh
        run: ./audit.ps1 -ChildPath target/release/child.exe -MasterPath dist/web2app.exe

  # 发布（仅 v* 标签）：Windows 单目标
  build:
    name: build (windows)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # --target 下 child 落在 target/<triple>/release，master/build.rs 经
      # ../target 定位 release/child.exe —— 先显式构建 child 保证模板就位。
      - name: Build child then workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p child --release --locked --target x86_64-pc-windows-msvc
          cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
          bin="target/x86_64-pc-windows-msvc/release/web2app.exe"
          size=$(wc -c < "$bin")
          if [ "$size" -gt 2097152 ]; then
            echo "::error::${bin} exceeds 2MB target ($size bytes)"
            exit 1
          fi
          mkdir -p dist
          cp "$bin" "dist/web2app-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.exe"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: dist/*
          if-no-files-found: error

  # 汇总产物 + SHA256SUMS → GitHub Release（发布物唯一来源）
  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          name: bin-windows
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum web2app-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Web2App ${GITHUB_REF_NAME}" \
            --generate-notes
