name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# 同一 ref 的新推送取消旧运行；tag 发布运行不取消（保证发布完整性）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# 最小权限：默认只读；release job 单独提升 contents: write
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 主门禁（G-0a）：Windows 是唯一发布目标，故 Windows 侧仍跑全部门禁
  # （winres 资源编译 / user32 MessageBox / UpdateResource / 体积红线 / 结构审计）。
  # Windows 之外的平台外壳在下一 job 验编译（阶段 0b 起 linux）。
  verify:
    name: verify (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # 两阶段构建是 v2 架构固有约束：master 编译期内嵌 child.exe，
      # 干净 target 下 cargo test 的并行调度不保证 child 先完成，必须显式先行。
      - name: Build child (debug; test/clippy 的前提)
        run: cargo build -p child --locked

      - name: Tests
        run: cargo test --locked --workspace

      - name: Clippy (zero warnings, warnings as errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      # build.ps1 保证顺序：child 先于 master（master 编译期内嵌 child.exe）
      - name: Release build (child -> master -> assemble)
        run: ./build.ps1 -SkipTests -SkipClippy

      - name: Size red lines (child < 1MB, web2app < 2MB)
        shell: bash
        run: |
          set -euo pipefail
          child=$(wc -c < target/release/child.exe)
          master=$(wc -c < dist/web2app.exe)
          echo "child:   $child bytes"
          echo "web2app: $master bytes"
          if [ "$child" -gt 1048576 ]; then echo "::error::child exceeds 1MB promise ($child)"; exit 1; fi
          if [ "$master" -gt 2097152 ]; then echo "::error::web2app exceeds 2MB target ($master)"; exit 1; fi

      # 结构性不可繁殖：child 产物不含写资源/签名/打包能力，且依赖图不含 master。
      - name: Structural non-reproduction audit
        shell: pwsh
        run: ./audit.ps1 -ChildPath target/release/child.exe -MasterPath dist/web2app.exe

  # Linux 接缝（阶段 0b）+ G-1 无头门禁（阶段 1）：平台外壳与 child/master 同签名
  # 可编译、单测/clippy 全绿之外，再跑完整 G-1（docs/CROSS_PLATFORM_DESIGN.md §7）——
  # ELF 结构审计（audit.ps1 Linux 分支）+ 无头 e2e（按键 × 焦点矩阵 / data_directory
  # 隔离 / deb 打包安装运行卸载）。wry 的 Linux 后端经 pkg-config 链接系统
  # WebKitGTK/GTK → 必须装开发库；e2e 另需 Xvfb/xdotool，以及 control Depends 的
  # 运行库（e2e 用 `dpkg -i` 直装，不解析依赖，故显式预装）。
  verify-linux:
    name: verify (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install WebKitGTK dev libraries + e2e prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb xdotool gstreamer1.0-libav gstreamer1.0-plugins-bad dbus-x11 at-spi2-core

      # 两阶段构建同 Windows：master 编译期内嵌 child（Linux 产物名为 child，无 .exe）。
      - name: Build child (debug; test/clippy 的前提)
        run: cargo build -p child --locked

      - name: Tests
        run: cargo test --locked --workspace

      - name: Clippy (zero warnings, warnings as errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      # 审计与 e2e 跑 release 产物（与 G-0a 口径一致：审计/演练对象 = 交付形态）。
      # 两阶段显式先行：并行调度不保证 child 先于 master 完成（同上）。
      - name: Release build (child -> workspace)
        run: |
          cargo build -p child --release --locked
          cargo build --workspace --release --locked

      # G-1：结构性不可繁殖审计（Linux 分支 = \x7fELF + e_shoff 映像计数）
      - name: Structural audit (ELF)
        shell: pwsh
        run: ./audit.ps1 -ChildPath target/release/child -MasterPath target/release/web2app

      # G-1：无头门禁（脚本自带 Xvfb 起停；全部以 exit code 判定）
      - name: E2E gate (headless Xvfb)
        env:
          NO_AT_BRIDGE: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          dbus-run-session -- bash -c 'CHILD=target/release/child MASTER=target/release/web2app bash e2e.sh'

  # 发布（仅 v* 标签）：Windows 单目标
  build:
    name: build (windows)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # --target 下 child 落在 target/<triple>/release，master/build.rs 经
      # ../target 定位 release/child.exe —— 先显式构建 child 保证模板就位。
      - name: Build child then workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p child --release --locked --target x86_64-pc-windows-msvc
          cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
          bin="target/x86_64-pc-windows-msvc/release/web2app.exe"
          size=$(wc -c < "$bin")
          if [ "$size" -gt 2097152 ]; then
            echo "::error::${bin} exceeds 2MB target ($size bytes)"
            exit 1
          fi
          mkdir -p dist
          cp "$bin" "dist/web2app-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.exe"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: dist/*
          if-no-files-found: error

  # Linux 发布：打包器自身的 .deb（用户 apt install 后即得 GUI 打包器）
  build-linux:
    name: build (linux)
    needs: verify-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install WebKitGTK dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build child then workspace
        run: |
          cargo build -p child --release --locked
          cargo build --workspace --release --locked

      - name: Create .deb package of web2app packager
        run: |
          set -euo pipefail
          STAGING=$(mktemp -d)
          mkdir -p "$STAGING/DEBIAN" \
                   "$STAGING/usr/bin" \
                   "$STAGING/usr/share/applications" \
                   "$STAGING/usr/share/icons/hicolor/256x256/apps" \
                   "$STAGING/usr/share/doc/web2app"

          cp target/release/web2app "$STAGING/usr/bin/web2app"
          chmod 755 "$STAGING/usr/bin/web2app"
          cp assets/logo_256.png "$STAGING/usr/share/icons/hicolor/256x256/apps/web2app.png"

          VERSION="${GITHUB_REF_NAME#v}"
          cat > "$STAGING/DEBIAN/control" <<EOF
          Package: web2app
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Web2App Packager <https://github.com/31i45/Web2App>
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0, gstreamer1.0-libav, gstreamer1.0-plugins-bad
          Description: Web2App packager - turn websites into desktop apps
          EOF

          cat > "$STAGING/usr/share/applications/web2app.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Web2App
          Comment=Turn websites into desktop apps
          Exec=/usr/bin/web2app
          Icon=web2app
          Terminal=false
          Categories=Development;
          EOF

          cat > "$STAGING/usr/share/doc/web2app/copyright" <<EOF
          Web2App Packager <https://github.com/31i45/Web2App>
          MIT License
          EOF

          dpkg-deb --build "$STAGING" "web2app-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.deb"
          rm -rf "$STAGING"
          ls -l web2app-*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux
          path: web2app-*.deb
          if-no-files-found: error

  # 汇总产物 + SHA256SUMS → GitHub Release（发布物唯一来源）
  release:
    name: publish release
    needs: [build, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # download-artifact@v4 无 name 时按 artifact 名建子目录（dist/bin-windows/、
      # dist/bin-linux/）→ merge-multiple 平铺合并进 dist/，产物文件名各不相同无冲突。
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum web2app-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # gh release create --generate-notes 在 ubuntu runner 上静默失败（无输出、
      # 不创建 release、exit 0）—— 换用 GitHub API 直接创建，显式报错不静默。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 已存在则先删除（幂等重发）
          RELEASE_ID=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])" 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            curl -sf -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID"
          fi
          # 创建 release
          RELEASE_ID=$(curl -sf -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"Web2App ${TAG}\"}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "release id: $RELEASE_ID"
          # 上传产物
          for f in dist/*; do
            NAME=$(basename "$f")
            echo "uploading: $NAME"
            curl -sf -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets?name=$NAME"
          done
          echo "release published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
