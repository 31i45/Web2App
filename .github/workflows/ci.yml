name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# 同一 ref 的新推送取消旧运行；tag 发布运行不取消（保证发布完整性）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# 最小权限：默认只读；release job 单独提升 contents: write
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 每次推送/PR：三平台矩阵验证（测试 + 严格 clippy + release 构建 + 10MB 红线）
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # wry/tao 在 Linux 需要 WebKitGTK 4.1 系统库（构建期头文件）；
      # gtk 为 tao 直接依赖（gdkwayland/gdkx11 的 .pc 均由 libgtk-3-dev 提供）
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --locked

      - name: Clippy (zero warnings, warnings as errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Release build + 10MB red line
        shell: bash
        run: |
          cargo build --release --locked
          bin="target/release/web2app"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="target/release/web2app.exe"; fi
          size=$(wc -c < "$bin")
          if [ "$size" -gt 10485760 ]; then
            echo "::error::master exceeds 10MB red line ($size bytes)"
            exit 1
          fi
          echo "master: $size bytes (within 10MB red line)"

  # 发布（仅 v* 标签）：四目标矩阵构建原生二进制，经 artifact 汇总到 release job
  build:
    name: build (${{ matrix.target }})
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build, red-line check, package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          cargo build --release --locked --target "$target"
          ext=""
          case "$target" in *windows*) ext=".exe";; esac
          bin="target/${target}/release/web2app${ext}"
          size=$(wc -c < "$bin")
          if [ "$size" -gt 10485760 ]; then
            echo "::error::${bin} exceeds 10MB red line ($size bytes)"
            exit 1
          fi
          mkdir -p dist
          if [ -n "$ext" ]; then
            cp "$bin" "dist/Web2App-${tag}-${target}.exe"
          else
            cp "$bin" Web2App
            tar -czf "dist/Web2App-${tag}-${target}.tar.gz" Web2App
            rm -f Web2App
          fi
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # 汇总四平台产物 + SHA256SUMS → GitHub Release（发布物唯一来源）
  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum Web2App-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Web2App ${GITHUB_REF_NAME}" \
            --generate-notes
