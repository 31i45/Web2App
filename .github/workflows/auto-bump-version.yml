name: Auto Bump Version + Release

# 当 dependabot PR 被合并进 main 后：
#   1. bump Cargo.toml [workspace.package].version 的 patch 位（3.0.4 → 3.0.5）
#   2. commit + push 回 main + 打 vX.Y.Z tag
#   3. tag push 自动触发 ci.yml 里 build + build-linux + publish-release 流水线
#
# 注意：此 workflow 只处理 dependabot 开的 PR（条件见 if），
# 手动 PR merged 不触发版本 bump。

on:
  pull_request:
    types: [closed]
  workflow_dispatch:   # 也可手动触发（手动 bump 版本场景）

permissions:
  contents: write          # 需要 push commit + tag

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    # 只在 dependabot PR merged 时自动跑；workflow_dispatch 手动触发跳过
    if: |
      github.event_name == 'workflow_dispatch'
      || (
        github.event.pull_request.merged == true
        && github.event.pull_request.user.login == 'dependabot[bot]'
      )

    steps:
      - uses: actions/checkout@v4
        with:
          # 拿完整 history 来 diff 验证 PR scope
          fetch-depth: 0

      # Step 1: 解析当前版本 + 算新版本
      - name: Compute new version
        id: version
        run: |
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)".*/\1/')
          if [ -z "$CURRENT" ]; then
            echo "::error::could not parse Cargo.toml version"
            exit 1
          fi
          IFS='.' read -ra V <<< "$CURRENT"
          MAJOR=${V[0]}
          MINOR=${V[1]}
          PATCH=${V[2]}
          NEW_PATCH=$((PATCH + 1))
          NEW="$MAJOR.$MINOR.$NEW_PATCH"
          TAG="v$NEW"
          echo "current: $CURRENT → new: $NEW (tag: $TAG)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"       >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"

      # Step 2: 验证确实是 dependabot 自动开的 PR（防手动 PR 误触发 bump）
      # 策略：检查 PR title 是否以 "build(deps):" 或 "build(deps-dev):" 开头 —
      # 这是 dependabot 固定格式，手动 PR 不会用。比文件白名单更可靠，
      # 因为 dependabot 升级 Actions 时本来就会改 .github/workflows/*.yml，
      # 而 CI 修复偶尔需要 cherry-pick build.rs 之类的文件到 PR 分支。
      - name: Verify PR is dependabot dependency bump
        if: github.event_name != 'workflow_dispatch'
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR title: $TITLE"
          case "$TITLE" in
            "build(deps):"* | "build(deps-dev):"*)
              echo "✓ Confirmed: dependabot dependency bump PR"
              ;;
            *)
              echo "::error::PR title does not match dependabot format (build(deps): ...)"
              echo "Manual or other-bot PRs will not trigger auto-bump."
              exit 1
              ;;
          esac

      # Step 3: 原地修改 Cargo.toml version（精确匹配 → 安全）
      - name: Patch Cargo.toml version
        run: |
          # 精确替换 version = "X.Y.Z" → version = "X.Y.(Z+1)"
          sed -i 's/^version = "'"${{ steps.version.outputs.current }}"'""/version = "'"${{ steps.version.outputs.new }}"'""/' Cargo.toml
          # 验证
          VERIFY=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)".*/\1/')
          if [ "$VERIFY" != "${{ steps.version.outputs.new }}" ]; then
            echo "::error::sed failed; expected ${{ steps.version.outputs.new }}, got $VERIFY"
            exit 1
          fi
          echo "✓ Cargo.toml bumped: $VERIFY"

      # Step 4: Commit + Push main + 打 annotated tag
      - name: Commit, push main, and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore(release): bump to ${{ steps.version.outputs.new }} (dependency update)"
          git push origin HEAD:main
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.new }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"
          echo "✅ Pushed main + tag ${{ steps.version.outputs.tag }}"

      # Step 5: 后续 build → release 由 ci.yml 自动接管（tag trigger）
      - name: Pipeline handoff
        run: |
          echo "Tag ${{ steps.version.outputs.tag }} pushed."
          echo "ci.yml will trigger build (windows) + build (linux) + publish release."
